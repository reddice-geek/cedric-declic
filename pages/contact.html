
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Déclic Informatique</title>
    <meta
        name="description"
        content="Contactez Déclic Informatique pour votre dépannage, réparation et assistance informatique."
    >

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        .contact-container {
            max-width: 720px;
            margin: 40px auto;
            padding: 24px;
        }

        .contact-form {
            display: grid;
            gap: 16px;
        }

        .contact-form label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .contact-form input,
        .contact-form select,
        .contact-form textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font: inherit;
        }

        .contact-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        #submitBtn {
            padding: 13px 18px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        #submitBtn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .form-message {
            padding: 12px;
            margin: 0;
            border-radius: 6px;
        }

        .hidden {
            display: none !important;
        }

        #ok {
            color: #155724;
            background: #d4edda;
        }

        #formError {
            color: #721c24;
            background: #f8d7da;
        }
    </style>
</head>

<body>
    <main class="contact-container">
        <h1>Contacter Déclic Informatique</h1>

        <p>
            Décris ton besoin et je te répondrai dès que possible.
            Les champs marqués d'un astérisque (*) sont obligatoires.
        </p>

        <form id="contactForm" class="contact-form">
            <div>
                <label for="nom">Nom et prénom *</label>
                <input
                    type="text"
                    id="nom"
                    name="nom"
                    autocomplete="name"
                    required
                    maxlength="150"
                >
            </div>

            <div>
                <label for="tel">Téléphone</label>
                <input
                    type="tel"
                    id="tel"
                    name="tel"
                    autocomplete="tel"
                    maxlength="30"
                >
            </div>

            <div>
                <label for="email">Adresse e-mail *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    maxlength="254"
                >
            </div>

            <div>
                <label for="sujet">Objet de la demande</label>
                <select id="sujet" name="sujet">
                    <option value="Diagnostic 20€">Diagnostic informatique</option>
                    <option value="Dépannage informatique">Dépannage informatique</option>
                    <option value="Installation Windows">Installation Windows</option>
                    <option value="Montage PC">Montage PC</option>
                    <option value="Conseil achat PC">Conseil pour acheter un PC</option>
                    <option value="Entretien informatique">Entretien informatique</option>
                    <option value="Autre demande">Autre demande</option>
                </select>
            </div>

            <div>
                <label for="message">Description de ta demande *</label>
                <textarea
                    id="message"
                    name="message"
                    required
                    maxlength="10000"
                ></textarea>
            </div>

            <p
                id="ok"
                class="form-message hidden"
                role="status"
                aria-live="polite"
            ></p>

            <p
                id="formError"
                class="form-message hidden"
                role="alert"
                aria-live="assertive"
            ></p>

            <button type="submit" id="submitBtn">
                Envoyer la demande
            </button>
        </form>
    </main>

    <script>
    (() => {
        const form = document.getElementById("contactForm");
        const okDiv = document.getElementById("ok");
        const errorDiv = document.getElementById("formError");
        const submitBtn = document.getElementById("submitBtn");

        if (!form || !okDiv || !errorDiv || !submitBtn) {
            console.error("Formulaire de contact : élément HTML manquant.");
            return;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            okDiv.textContent = "";
            errorDiv.textContent = "";
            okDiv.classList.add("hidden");
            errorDiv.classList.add("hidden");

            submitBtn.disabled = true;
            submitBtn.textContent = "Envoi en cours...";

            try {
                const formData = new FormData(form);
                const donnees = Object.fromEntries(formData.entries());

                const response = await fetch("/api/contact", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(donnees)
                });

                // Certaines erreurs serveur peuvent ne pas renvoyer du JSON.
                const result = await response.json().catch(() => null);

                if (!response.ok || !result || result.success !== true) {
                    throw new Error(
                        result?.error ||
                        result?.message ||
                        `Le serveur a répondu avec le statut ${response.status}.`
                    );
                }

                okDiv.textContent =
                    "Merci ! Ta demande a bien été enregistrée.";

                okDiv.classList.remove("hidden");
                form.reset();

            } catch (error) {
                console.error("Envoi du formulaire :", error);

                errorDiv.textContent =
                    error.message ||
                    "Impossible de confirmer l'envoi. Réessaie ou contacte-moi directement au 07 83 20 87 86.";

                errorDiv.classList.remove("hidden");

            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Envoyer la demande";
            }
        });
    })();
    </script>
</body>
</html>
